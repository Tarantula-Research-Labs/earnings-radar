name: NSE probe
on:
  push:
    branches: [ci-test]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/nse_probe.py
      - name: Save result to branch ci-test-results
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git checkout --orphan ci-test-results
          git rm -rq --cached . ; git add probe.json
          git commit -qm "probe $(date -u +%FT%TZ)"
          git push -f origin ci-test-results
