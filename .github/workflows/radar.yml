# Earnings Radar on GitHub Actions. Replaces the Claude scheduled tasks.
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  -> earnings-radar-bot key (S3 only)
#   ANTHROPIC_API_KEY                         -> Claude API key for the news reading
# Optional repository variables: RADAR_MODEL, RADAR_MAX_STOCKS.
name: Earnings Radar

on:
  schedule:
    - cron: "15 3 * * 1-5"     # 08:45 IST morning: add today's reporters
    - cron: "50 9 * * 1-5"     # 15:20 IST afternoon: check filings
    - cron: "20 15 * * 1-5"    # 20:50 IST evening: prices + news reading
    - cron: "37 17 13,28 * *"  # 23:07 IST on the 13th and 28th: sector hypotheses
  workflow_dispatch:
    inputs:
      task:
        description: "morning, afternoon, evening or hypotheses"
        required: true
        default: evening
      since:
        description: "morning only: add reporters from this date (YYYY-MM-DD) to today"
        required: false
  push:
    branches: [main]
    paths: [".github/run-now.json"]   # push this file to start a run: {"task": "evening"}

concurrency:
  group: earnings-radar        # never two runs writing to S3 at once
  cancel-in-progress: false

permissions:
  contents: write              # only for the keep-alive commit on hypotheses runs

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RADAR_MODEL: ${{ vars.RADAR_MODEL || 'claude-sonnet-5-5' }}
      RADAR_MAX_STOCKS: ${{ vars.RADAR_MAX_STOCKS || '15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Pick the task
        id: pick
        run: |
          t=""; s=""
          case "${{ github.event_name }}" in
            schedule)
              case "${{ github.event.schedule }}" in
                "15 3 * * 1-5")    t=morning ;;
                "50 9 * * 1-5")    t=afternoon ;;
                "20 15 * * 1-5")   t=evening ;;
                "37 17 13,28 * *") t=hypotheses ;;
              esac ;;
            workflow_dispatch) t="${{ inputs.task }}"; s="${{ inputs.since }}" ;;
            push) t=$(python3 -c "import json;print(json.load(open('.github/run-now.json')).get('task',''))")
                  s=$(python3 -c "import json;print(json.load(open('.github/run-now.json')).get('since',''))") ;;
          esac
          echo "task=$t" >> "$GITHUB_OUTPUT"; echo "since=$s" >> "$GITHUB_OUTPUT"
          echo "Task: $t ${s:+(since $s)}"

      - name: Morning
        if: steps.pick.outputs.task == 'morning'
        run: |
          if [ -n "${{ steps.pick.outputs.since }}" ]; then
            python3 radar.py morning,check,log --task morning --since "${{ steps.pick.outputs.since }}"
          else
            python3 radar.py morning,check,log --task morning
          fi

      - name: Afternoon
        if: steps.pick.outputs.task == 'afternoon'
        run: python3 radar.py check,log --task afternoon

      - name: Evening - prices and returns
        if: steps.pick.outputs.task == 'evening'
        run: python3 radar.py evening
      - name: Evening - news reading (Claude API)
        id: read
        if: steps.pick.outputs.task == 'evening'
        continue-on-error: true
        run: python3 agent.py evening
      - name: Evening - save reasons, summaries, fundamentals, outlooks
        if: steps.pick.outputs.task == 'evening'
        run: |
          if [ -s res/reasons.json ] && [ "${{ steps.read.outcome }}" = "success" ]; then
            python3 radar.py merge,log res/reasons.json --task evening --notes "$(cat out/agent_notes.txt 2>/dev/null)"
          else
            python3 radar.py log --task evening --status partial --notes "news reading failed: $(cat out/agent_notes.txt 2>/dev/null)"
          fi

      - name: Hypotheses
        if: steps.pick.outputs.task == 'hypotheses'
        run: |
          python3 radar.py hypo
          if python3 agent.py hypo && [ -s res/hypotheses.json ]; then
            python3 radar.py hyposave,log res/hypotheses.json --task hypotheses --notes "$(cat out/agent_notes.txt)"
          else
            python3 radar.py log --task hypotheses --status partial --notes "hypotheses failed: $(cat out/agent_notes.txt 2>/dev/null)"
          fi
      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows in repos with no commits for 60 days.
        if: steps.pick.outputs.task == 'hypotheses'
        run: |
          date -u +%FT%TZ > .github/last-run.txt
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add .github/last-run.txt && git commit -qm "keep-alive $(date -u +%F)" && git push || true
